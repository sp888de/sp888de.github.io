<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — GUNSTAR</title>
<meta name="description" content="GUNSTAR photo and video gallery — the pieces, the shoots, the behind the scenes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="header">
  <div class="header__inner">
<a href="index.html" class="brand">
  <span class="brand__badge">G★</span>
  GUNSTAR
</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="galerie.html" aria-current="page">Gallery</a>
      <a href="a-propos.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
  </div>
</header>

<section class="section section--tight">
  <div class="container">
    <div class="catalog-head">
      <div>
        <p class="eyebrow">Visuals</p>
        <h1 style="font-size:clamp(2.4rem,6vw,4rem);">Gallery</h1>
        <p style="margin-top:1rem;">Gallery of the different projects powered by GUNSTAR.</p>
      </div>
      <div class="catalog-filters" role="group" aria-label="Filter the gallery">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="photo" aria-pressed="false">Mercenary</button>
        <button type="button" data-filter="video" aria-pressed="false">Business man</button>
        <button type="button" data-filter="video" aria-pressed="false">Hacker</button>
      </div>
    </div>
  </div>
</section>

<section class="section section--tight">
  <div class="container">
    <div class="catalog" data-gallery>
      <!-- ================================================================
           Each link below is one catalog tile. It opens product.html
           with ?item=<id>, and product.html pulls the rest of the
           content (title, description, details) from products-data.js.

           To add a new tile:
             1. Add a new object to assets/js/products-data.js
             2. Copy one of the blocks below, set href="product.html?item=<id>"
                and data-type + the thumbnail (img or video) to match.
      ================================================================= -->

      <a class="catalog-item reveal" data-type="photo" href="product.html?item=01" aria-label="Open Look 01">
        <div class="catalog-item__media">
          <span class="catalog-item__index">N°01</span>
          <img src="assets/img/etoile_blanche.png" alt="Look 01" loading="lazy">
        </div>
        <div class="catalog-item__caption">
          <span class="name">Look 01</span>
          <span class="type">Photo</span>
        </div>
      </a>

      <a class="catalog-item reveal" data-type="video" href="product.html?item=02" aria-label="Open video 1011">
        <div class="catalog-item__media">
          <span class="catalog-item__index">N°02</span>
          <video src="assets/video/gunstarhomepage_2.mp4"
                 autoplay muted loop playsinline
                 preload="metadata"></video>
          <span class="catalog-item__play">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><polygon points="6 4 20 12 6 20 6 4"/></svg>
          </span>
        </div>
        <div class="catalog-item__caption">
          <span class="name">1011</span>
          <span class="type">Video</span>
        </div>
      </a>

      <a class="catalog-item reveal" data-type="video" href="product.html?item=03" aria-label="Open video 1012">
        <div class="catalog-item__media">
          <span class="catalog-item__index">N°03</span>
          <video src="assets/video/gunstarhomepage_2.mp4"
                 autoplay muted loop playsinline
                 preload="metadata"></video>
          <span class="catalog-item__play">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><polygon points="6 4 20 12 6 20 6 4"/></svg>
          </span>
        </div>
        <div class="catalog-item__caption">
          <span class="name">1012</span>
          <span class="type">Video</span>
        </div>
      </a>

      <a class="catalog-item reveal" data-type="video" href="product.html?item=04" aria-label="Open video 1101">
        <div class="catalog-item__media">
          <span class="catalog-item__index">N°04</span>
          <video src="assets/video/gunstarhomepage_2.mp4"
                 autoplay muted loop playsinline
                 preload="metadata"></video>
          <span class="catalog-item__play">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><polygon points="6 4 20 12 6 20 6 4"/></svg>
          </span>
        </div>
        <div class="catalog-item__caption">
          <span class="name">1101</span>
          <span class="type">Video</span>
        </div>
      </a>

      <a class="catalog-item reveal" data-type="video" href="product.html?item=05" aria-label="Open video 1102">
        <div class="catalog-item__media">
          <span class="catalog-item__index">N°05</span>
          <video src="assets/video/gunstarhomepage_2.mp4"
                 autoplay muted loop playsinline
                 preload="metadata"></video>
          <span class="catalog-item__play">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><polygon points="6 4 20 12 6 20 6 4"/></svg>
          </span>
        </div>
        <div class="catalog-item__caption">
          <span class="name">1102</span>
          <span class="type">Video</span>
        </div>
      </a>

      <a class="catalog-item reveal" data-type="video" href="product.html?item=06" aria-label="Open video 1001">
        <div class="catalog-item__media">
          <span class="catalog-item__index">N°06</span>
          <video src="assets/video/gunstarhomepage_2.mp4"
                 autoplay muted loop playsinline
                 preload="metadata"></video>
          <span class="catalog-item__play">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><polygon points="6 4 20 12 6 20 6 4"/></svg>
          </span>
        </div>
        <div class="catalog-item__caption">
          <span class="name">1001</span>
          <span class="type">Video</span>
        </div>
      </a>

    </div>
  </div>
</section>
