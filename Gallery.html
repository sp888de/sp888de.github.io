<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gunstar - Visual gallery</title>
  <meta name="description" content="Explore the GUNSTAR poster collection in a 3D gallery. Shop A3 portrait prints on 200 g/m² paper.">
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/iptm1k0x/image/upload/demon_face.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=IBM+Plex+Mono:wght@500;600&family=Newsreader:ital@0;1&family=Oswald:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/gallery.css?v=popstar-editions">
</head>
<body class="gallery-page">
  <header class="header">
    <div class="header__inner">
      <a href="index.html" class="brand" aria-label="GUNSTAR home">
        <img src="assets/img/etoile_blanche.png" class="brand__logo-symbol" alt="">
        <img src="assets/img/bogo_blanc.png" class="brand__logo-wordmark" alt="GUNSTAR">
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="Shop.html">Shop</a>
        <a href="Gallery.html" aria-current="page">Gallery</a>
        <a href="a-propos.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main>
    <section class="gallery-room" id="gallery-room" aria-label="Exhibition room" hidden>
      <div class="gallery-stage" id="gallery-stage" aria-hidden="true"></div>
      <div class="gallery-veil" aria-hidden="true"></div>

      <div class="gallery-walk" aria-label="Walk through the gallery">
        <button type="button" id="gallery-prev" aria-label="Previous position">←</button>
        <button type="button" id="gallery-next" aria-label="Next position">→</button>
      </div>
      <p class="gallery-hint" id="gallery-hint">Scroll or drag to walk<br>Select an artwork to look closer</p>

      <div class="gallery-caption">
        <p>GUNSTAR VISUAL ARCHIVE</p>
        <h1>GALLERY</h1>
        <button class="gallery-underlined" type="button" id="gallery-collection">View the collection <span aria-hidden="true">↗</span></button>
      </div>

      <div class="gallery-focus" id="gallery-focus" hidden>
        <span id="gallery-focus-title" aria-live="polite"></span>
        <button type="button" id="gallery-open">Open artwork <span aria-hidden="true">↗</span></button>
        <button type="button" id="gallery-step-back">Step back</button>
      </div>
      <button class="gallery-current gallery-underlined" id="gallery-look" type="button">Look closer <span aria-hidden="true">↗</span></button>
    </section>

    <section class="gallery-list" id="gallery-list" aria-labelledby="gallery-list-title">
      <p class="gallery-list-kicker">GUNSTAR VISUAL ARCHIVE</p>
      <h2 id="gallery-list-title" tabindex="-1">COLLECTION</h2>
      <div class="gallery-grid" id="gallery-grid"></div>
    </section>
    <div class="gallery-views" role="group" aria-label="Gallery view" hidden>
      <button type="button" id="gallery-room-view" aria-pressed="false" aria-controls="gallery-room">Room</button>
      <button type="button" id="gallery-list-view" aria-pressed="true" aria-controls="gallery-list">Collection</button>
    </div>
  </main>

  <dialog class="gallery-detail" id="gallery-detail" aria-labelledby="gallery-detail-title">
    <form method="dialog"><button class="gallery-close" aria-label="Close artwork">×</button></form>
    <div class="gallery-detail-layout">
      <div class="gallery-detail-image"><img id="gallery-artwork" alt=""></div>
      <div class="gallery-detail-copy">
        <p class="gallery-detail-kicker">GUNSTAR VISUAL ARCHIVE</p>
        <h2 id="gallery-detail-title"></h2>
        <p class="gallery-poster-specs" id="gallery-poster-specs"></p>
        <p id="gallery-dimensions"></p>
        <button class="gallery-purchase" id="gallery-add-to-cart" type="button">Add to cart <span aria-hidden="true">+</span></button>
        <button class="gallery-underlined" type="button" id="gallery-locate" hidden>View in room <span aria-hidden="true">↗</span></button>
      </div>
    </div>
  </dialog>
  <script defer src="assets/js/products-data.js?v=a3-cart"></script>
  <script defer src="assets/js/cart.js?v=a3-cart"></script>
  <script defer src="assets/js/script.js"></script>
  <script type="module" src="assets/js/gallery.js?v=popstar-editions"></script>
</body>
</html>
